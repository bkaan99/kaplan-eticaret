<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="100%" height="100%" fill="none">
  <!-- Gradient Definitions -->
  <defs>
    <radialGradient id="sliceSkinGrad" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#14532d" />
      <stop offset="92%" stop-color="#052e16" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>
    <radialGradient id="slicePulpGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="45%" stop-color="#d1fae5" />
      <stop offset="85%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </radialGradient>
    <linearGradient id="tigerAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <filter id="sliceShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Pickle Slice: Left side (110x110) -->
  <g transform="translate(15, 15)" filter="url(#sliceShadow)">
    <!-- Outer Cucumber Skin with Crisp Wavy Ridges -->
    <path d="M 55 4 C 64 4, 71 8, 80 13 C 89 18, 97 26, 101 35 C 106 44, 106 55, 104 65 C 101 75, 95 84, 87 91 C 79 98, 68 103, 58 105 C 47 106, 36 103, 26 97 C 17 90, 11 81, 7 71 C 4 61, 4 50, 8 40 C 13 30, 20 21, 29 15 C 38 9, 46 4, 55 4 Z" 
          fill="url(#sliceSkinGrad)" />

    <!-- Inner Crisp Pickle Pulp (Translucent green/lime) -->
    <path d="M 55 12 C 63 12, 69 15, 77 19 C 85 24, 91 30, 95 38 C 98 46, 98 55, 96 63 C 93 71, 88 79, 81 85 C 74 91, 65 95, 56 97 C 47 98, 38 95, 30 90 C 22 84, 17 76, 14 68 C 11 60, 11 50, 15 42 C 19 34, 25 26, 33 21 C 41 16, 48 12, 55 12 Z" 
          fill="url(#slicePulpGrad)" />

    <!-- Center Seed Arrangement Forming a Clever Tiger Face -->
    <!-- Forehead seed stripes -->
    <ellipse cx="55" cy="27" rx="2" ry="5.5" fill="#047857" opacity="0.9" />
    <ellipse cx="47" cy="30" rx="1.8" ry="4.5" transform="rotate(-18 47 30)" fill="#047857" opacity="0.8" />
    <ellipse cx="63" cy="30" rx="1.8" ry="4.5" transform="rotate(18 63 30)" fill="#047857" opacity="0.8" />

    <!-- Eyes formed by sleek curved cucumber seeds -->
    <path d="M 39 45 C 43 43, 47 46, 46 49 C 42 50, 39 48, 39 45 Z" fill="#064e3b" />
    <circle cx="43" cy="46" r="1.2" fill="#fef08a" />
    
    <path d="M 71 45 C 67 43, 63 46, 64 49 C 68 50, 71 48, 71 45 Z" fill="#064e3b" />
    <circle cx="67" cy="46" r="1.2" fill="#fef08a" />

    <!-- Whiskers & Cheeks formed by radiating seed pockets -->
    <!-- Left Whiskers -->
    <ellipse cx="33" cy="55" rx="4.5" ry="1.6" transform="rotate(-15 33 55)" fill="#047857" opacity="0.75" />
    <ellipse cx="31" cy="62" rx="4.2" ry="1.5" transform="rotate(8 31 62)" fill="#047857" opacity="0.75" />
    <ellipse cx="35" cy="69" rx="3.8" ry="1.4" transform="rotate(25 35 69)" fill="#047857" opacity="0.75" />

    <!-- Right Whiskers -->
    <ellipse cx="77" cy="55" rx="4.5" ry="1.6" transform="rotate(15 77 55)" fill="#047857" opacity="0.75" />
    <ellipse cx="79" cy="62" rx="4.2" ry="1.5" transform="rotate(-8 79 62)" fill="#047857" opacity="0.75" />
    <ellipse cx="75" cy="69" rx="3.8" ry="1.4" transform="rotate(-25 75 69)" fill="#047857" opacity="0.75" />

    <!-- Nose & Mouth core seeds -->
    <path d="M 53 54 L 57 54 L 55 58 Z" fill="#064e3b" />
    <ellipse cx="51" cy="65" rx="2.5" ry="1.2" transform="rotate(-20 51 65)" fill="#047857" opacity="0.85" />
    <ellipse cx="59" cy="65" rx="2.5" ry="1.2" transform="rotate(20 59 65)" fill="#047857" opacity="0.85" />
    <!-- Chin seed -->
    <ellipse cx="55" cy="74" rx="3" ry="1.5" fill="#047857" opacity="0.7" />
  </g>

  <!-- Typography: Right side (Modern Scandinavian Minimal) -->
  <g transform="translate(145, 30)">
    <!-- Brand Name: KAPLAN -->
    <text x="0" y="44" 
          font-family="system-ui, -apple-system, 'SF Pro Display', Roboto, sans-serif" 
          font-size="46" 
          font-weight="800" 
          letter-spacing="5" 
          fill="#052e16">
      KAPLAN
    </text>

    <!-- Subtitle: GURME TURŞU -->
    <text x="3" y="72" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="14" 
          font-weight="700" 
          letter-spacing="8" 
          fill="#059669">
      GURME TURŞU
    </text>

    <!-- Heritage Slogan & Star Accents -->
    <line x1="3" y1="83" x2="260" y2="83" stroke="#e2e8f0" stroke-width="1.2" />
    <text x="3" y="97" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="10.5" 
          font-weight="600" 
          letter-spacing="3" 
          fill="#64748b">
      ÇITIR DİLİMLER • SAF LEZZET
    </text>
  </g>
</svg>

