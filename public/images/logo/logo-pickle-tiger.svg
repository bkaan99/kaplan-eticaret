<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="100%" height="100%" fill="none">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="emeraldDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="pickleGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadowB" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Emblem Icon: Geometric Minimalist Tiger & Pickle (110x110) -->
  <g transform="translate(15, 15)" filter="url(#shadowB)">
    <!-- Base Circular Badge -->
    <circle cx="55" cy="55" r="52" fill="#064e3b" />
    <circle cx="55" cy="55" r="48" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="2 3" opacity="0.6" />

    <!-- Tiger Ears (shaped like fresh bay/grape leaves) -->
    <path d="M 28 32 C 22 20, 36 12, 42 22 Z" fill="#fbbf24" />
    <path d="M 82 32 C 88 20, 74 12, 68 22 Z" fill="#fbbf24" />

    <!-- Forehead Stripes (Shaped like gherkins/pickles pointing down) -->
    <path d="M 55 24 C 53 34, 53 40, 55 45 C 57 40, 57 34, 55 24 Z" fill="#fbbf24" />
    <path d="M 46 27 C 42 34, 43 40, 48 43 C 46 38, 46 32, 46 27 Z" fill="#fbbf24" opacity="0.85" />
    <path d="M 64 27 C 68 34, 67 40, 62 43 C 64 38, 64 32, 64 27 Z" fill="#fbbf24" opacity="0.85" />

    <!-- Tiger Eyes (Crisp, proud, almond-shaped) -->
    <path d="M 33 50 C 40 46, 45 52, 47 54 C 41 57, 36 55, 33 50 Z" fill="#ffffff" />
    <circle cx="41" cy="52" r="2.8" fill="#fbbf24" />
    <circle cx="41.5" cy="52" r="1.4" fill="#022c22" />

    <path d="M 77 50 C 70 46, 65 52, 63 54 C 69 57, 74 55, 77 50 Z" fill="#ffffff" />
    <circle cx="69" cy="52" r="2.8" fill="#fbbf24" />
    <circle cx="68.5" cy="52" r="1.4" fill="#022c22" />

    <!-- Cheeks & Whiskers: Crafted like curved pickle sprigs / dill -->
    <!-- Left Whiskers -->
    <path d="M 46 68 C 30 67, 18 61, 14 56 C 22 66, 34 71, 46 71 Z" fill="#34d399" />
    <path d="M 46 73 C 32 75, 22 72, 17 68 C 24 78, 36 80, 46 76 Z" fill="#10b981" />
    <!-- Right Whiskers -->
    <path d="M 64 68 C 80 67, 92 61, 96 56 C 88 66, 76 71, 64 71 Z" fill="#34d399" />
    <path d="M 64 73 C 78 75, 88 72, 93 68 C 86 78, 74 80, 64 76 Z" fill="#10b981" />

    <!-- Nose & Mouth: A crisp gherkin slice / pickle silhouette -->
    <path d="M 52 62 L 58 62 L 55 67 Z" fill="#fbbf24" />
    <path d="M 55 67 L 55 75 C 51 77, 47 75, 45 73" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 55 67 L 55 75 C 59 77, 63 75, 65 73" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Bottom Chin: Crisp cucumber arc -->
    <path d="M 46 82 C 51 86, 59 86, 64 82 C 60 88, 50 88, 46 82 Z" fill="#34d399" />
  </g>

  <!-- Typography: Right side -->
  <g transform="translate(145, 30)">
    <!-- Brand Name: KAPLAN -->
    <text x="0" y="44" 
          font-family="'Cinzel', 'Playfair Display', Georgia, serif" 
          font-size="44" 
          font-weight="800" 
          letter-spacing="4" 
          fill="#064e3b">
      KAPLAN
    </text>

    <!-- Subtitle: GURME TURŞU -->
    <text x="3" y="72" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="14.5" 
          font-weight="700" 
          letter-spacing="7" 
          fill="#d97706">
      GURME TURŞU
    </text>

    <!-- Heritage Slogan & Star Accents -->
    <line x1="3" y1="83" x2="270" y2="83" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="3" y="97" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="10.5" 
          font-weight="600" 
          letter-spacing="2.5" 
          fill="#475569">
      KATKISIZ • KITIR • ÇUBUK USULÜ
    </text>
  </g>
</svg>

