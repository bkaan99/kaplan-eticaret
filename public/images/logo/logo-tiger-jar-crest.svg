<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 145" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="jarGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="jarAmberStripe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadowJar" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- AMBLEM: Cam Kavanoz ve Kaplan Çizgileri (120x120) -->
  <g transform="translate(15, 12)" filter="url(#shadowJar)">
    <!-- Zemin Rozeti -->
    <rect x="0" y="0" width="120" height="120" rx="30" fill="#f8faf6" stroke="#064e3b" stroke-width="2" stroke-opacity="0.15" />

    <!-- Cam Kavanoz Silueti -->
    <!-- Kavanoz Kapağı -->
    <rect x="42" y="16" width="36" height="8" rx="3" fill="#064e3b" />
    <line x1="45" y1="20" x2="75" y2="20" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
    <!-- Kavanoz Boynu -->
    <rect x="47" y="24" width="26" height="5" fill="#047857" opacity="0.8" />
    <!-- Kavanoz Gövdesi -->
    <path d="M 34 32 C 34 29, 39 29, 44 29 L 76 29 C 81 29, 86 29, 86 32 C 86 42, 88 88, 84 96 C 81 102, 39 102, 36 96 C 32 88, 34 42, 34 32 Z" 
          fill="url(#jarGlassGrad)" />

    <!-- KAVANOZUN İÇİNDEN YÜKSELEN KAPLAN ÇİZGİLERİ VE GÖZLERİ (TIGER ESSENCE IN BRINE) -->
    <!-- Alın Kaplan Çizgileri -->
    <path d="M 60 36 C 58 44, 58 50, 60 55 C 62 50, 62 44, 60 36 Z" fill="url(#jarAmberStripe)" />
    <path d="M 52 40 C 48 46, 49 52, 54 55 C 51 50, 50 45, 52 40 Z" fill="url(#jarAmberStripe)" opacity="0.85" />
    <path d="M 68 40 C 72 46, 71 52, 66 55 C 69 50, 70 45, 68 40 Z" fill="url(#jarAmberStripe)" opacity="0.85" />

    <!-- Kaplanın Derin Amber Gözleri -->
    <path d="M 46 62 C 51 59, 54 64, 55 66 C 50 68, 47 67, 46 62 Z" fill="#ffffff" />
    <circle cx="51" cy="64" r="2.2" fill="#fbbf24" />
    <circle cx="51" cy="64" r="1.1" fill="#022c22" />

    <path d="M 74 62 C 69 59, 66 64, 65 66 C 70 68, 73 67, 74 62 Z" fill="#ffffff" />
    <circle cx="69" cy="64" r="2.2" fill="#fbbf24" />
    <circle cx="69" cy="64" r="1.1" fill="#022c22" />

    <!-- Yanaklardaki Turşu-Bıyık Çizgileri -->
    <path d="M 48 74 C 38 72, 32 68, 28 65 C 33 72, 40 76, 48 76 Z" fill="#34d399" />
    <path d="M 72 74 C 82 72, 88 68, 92 65 C 87 72, 80 76, 72 76 Z" fill="#34d399" />

    <!-- Kavanozun Altında Yatan Kornişon ve Sarımsak -->
    <path d="M 42 86 C 50 82, 62 82, 70 87 C 62 91, 48 91, 42 86 Z" fill="#22c55e" />
    <circle cx="58" cy="85" r="2" fill="#fbbf24" />
  </g>

  <!-- TİPOGRAFİ (Sağ Taraf) -->
  <g transform="translate(155, 28)">
    <text x="0" y="44" 
          font-family="'Playfair Display', Georgia, serif" 
          font-size="45" 
          font-weight="800" 
          letter-spacing="3" 
          fill="#064e3b">
      KAPLAN
    </text>

    <text x="2" y="74" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="14.5" 
          font-weight="800" 
          letter-spacing="8" 
          fill="#d97706">
      GURME TURŞU
    </text>

    <line x1="2" y1="85" x2="310" y2="85" stroke="#cbd5e1" stroke-width="1.5" />

    <text x="2" y="100" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="2.5" 
          fill="#475569">
      KAVANOZDA SAKLI DOĞAL GÜÇ VE ÇITIRLIK
    </text>
  </g>
</svg>

