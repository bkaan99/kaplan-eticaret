name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Tip denetimi (workers, scripts ve testler dahil)
      - run: npm run typecheck

      # Birim + entegrasyon testleri (bellek içi D1 üzerinde)
      - run: npm run test:all

      # Bilgilendirme: eski lint hataları bu işi kırmasın, yenileri görünür olsun.
      - run: npm run lint
        continue-on-error: true
